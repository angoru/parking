{% extends "base.html" %}
{% block title %}Plaza {{ plaza.numero }}{% endblock %}
{% block content %}
<h1>Plaza {{ plaza.numero }}</h1>
<p class="texto-suave">{{ fecha | fecha_larga }}</p>
<form method="post" action="/{{ 'solicitar' if dia == 'hoy' else 'reservar' }}/{{ plaza.id }}" class="tarjeta formulario">
  <input type="hidden" name="fecha" value="{{ fecha.isoformat() }}">
  <label>Nombre
    <input name="nombre" value="{{ nombre }}" maxlength="{{ nombre_max }}" required autocomplete="name" autocapitalize="words" autofocus>
  </label>
  {% if dia == 'hoy' %}
    <p class="ayuda">Es para hoy: el admin recibirá la solicitud y tendrá que aprobarla.</p>
    <button class="boton boton-primario" type="submit">Enviar solicitud</button>
  {% else %}
    <button class="boton boton-primario" type="submit">Confirmar reserva</button>
  {% endif %}
  <a class="boton boton-fantasma" href="/?dia={{ dia }}">Volver</a>
</form>
{% endblock %}
