version: 2
updates:
  # Un solo PR semanal por tipo, para fusionarlos de una vez sin conflictos entre ellos
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ['*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      acciones:
        patterns: ['*']
